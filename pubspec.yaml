name: lifeline
description: "Lifeline emergency health app sign in, register, and emergency map UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_maps_flutter: ^2.5.3
  geolocator: ^14.0.0
  geocoding: ^5.0.0
  http: ^1.2.0
  url_launcher: ^6.2.5
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
